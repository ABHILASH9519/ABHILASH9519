<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="t"><title id="t">Ion Matrix capability network</title>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#02040B"/><stop offset="1" stop-color="#061326"/></linearGradient><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#00DFFF" stroke-opacity=".12"/></pattern><filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>

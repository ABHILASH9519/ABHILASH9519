<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="56" viewBox="0 0 1200 56" font-family="'JetBrains Mono','Fira Code','SF Mono','Courier New',monospace">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#05070D"/><stop offset="1" stop-color="#0D1320"/></linearGradient>
<linearGradient id="txt" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".5" stop-color="#E2E8F0"/><stop offset="1" stop-color="#64748B"/></linearGradient>
<linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#64748B"/><stop offset="1" stop-color="#64748B" stop-opacity="0"/></linearGradient>
<radialGradient id="planet" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".35" stop-color="#E2E8F0"/><stop offset="1" stop-color="#0D1320"/></radialGradient>
<pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#64748B" stroke-opacity=".10"/></pattern>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
.blink{animation:blink 1s steps(2) infinite}@keyframes blink{50%{opacity:0}}
.tw{animation:tw 3s ease-in-out infinite}@keyframes tw{50%{opacity:.15}}
.pulse{animation:pulse 2.4s ease-in-out infinite}@keyframes pulse{50%{opacity:.35}}
.flow{stroke-dasharray:8 10;animation:flow 1.6s linear infinite}@keyframes flow{to{stroke-dashoffset:-36}}
</style>
<rect width="1200" height="56" fill="url(#bg)"/>
<rect width="1200" height="56" fill="url(#grid)"/>
<rect x="6" y="8" width="64" height="40" rx="6" fill="#64748B" fill-opacity=".18" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="38" y="35" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">02</text>
<text x="90" y="36" font-size="24" font-weight="700" fill="url(#txt)"><tspan fill="#E2E8F0">$ </tspan>skill_radar --live</text>
<path d="M420 28H1170" stroke="url(#line)" stroke-width="2"/>
<circle cx="1176" cy="28" r="5" fill="#E2E8F0" class="pulse" filter="url(#glow)"/>
</svg>
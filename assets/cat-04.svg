<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="42" viewBox="0 0 1200 42" font-family="'JetBrains Mono','Fira Code','SF Mono','Courier New',monospace">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#021A1F"/><stop offset="1" stop-color="#052E35"/></linearGradient>
<linearGradient id="txt" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#CCFBF1"/><stop offset=".5" stop-color="#2DD4BF"/><stop offset="1" stop-color="#14B8A6"/></linearGradient>
<linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#14B8A6"/><stop offset="1" stop-color="#14B8A6" stop-opacity="0"/></linearGradient>
<radialGradient id="planet" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#CCFBF1"/><stop offset=".35" stop-color="#2DD4BF"/><stop offset="1" stop-color="#052E35"/></radialGradient>
<pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#14B8A6" stroke-opacity=".10"/></pattern>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
.blink{animation:blink 1s steps(2) infinite}@keyframes blink{50%{opacity:0}}
.tw{animation:tw 3s ease-in-out infinite}@keyframes tw{50%{opacity:.15}}
.pulse{animation:pulse 2.4s ease-in-out infinite}@keyframes pulse{50%{opacity:.35}}
.flow{stroke-dasharray:8 10;animation:flow 1.6s linear infinite}@keyframes flow{to{stroke-dashoffset:-36}}
</style>
<rect width="1200" height="42" fill="url(#bg)"/>
<rect width="1200" height="42" fill="url(#grid)"/>
<rect x="6" y="6" width="52" height="30" rx="4" fill="#14B8A6" fill-opacity=".2" stroke="#2DD4BF"/>
<text x="32" y="27" text-anchor="middle" font-size="16" font-weight="700" fill="#CCFBF1">04</text>
<text x="74" y="28" font-size="18" letter-spacing="2" fill="#2DD4BF">DATABASES &amp; MESSAGING</text>
<path d="M419 21H1190" stroke="url(#line)" stroke-width="1.5" stroke-dasharray="3 5"/>
</svg>
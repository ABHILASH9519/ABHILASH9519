<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310" font-family="'JetBrains Mono','Fira Code','SF Mono','Courier New',monospace">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00080F"/><stop offset="1" stop-color="#001B2B"/></linearGradient>
<linearGradient id="txt" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#E6FFFF"/><stop offset=".5" stop-color="#00F0FF"/><stop offset="1" stop-color="#00CFFF"/></linearGradient>
<linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00CFFF"/><stop offset="1" stop-color="#00CFFF" stop-opacity="0"/></linearGradient>
<radialGradient id="planet" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#E6FFFF"/><stop offset=".35" stop-color="#00F0FF"/><stop offset="1" stop-color="#001B2B"/></radialGradient>
<pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#00CFFF" stroke-opacity=".10"/></pattern>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
.blink{animation:blink 1s steps(2) infinite}@keyframes blink{50%{opacity:0}}
.tw{animation:tw 3s ease-in-out infinite}@keyframes tw{50%{opacity:.15}}
.pulse{animation:pulse 2.4s ease-in-out infinite}@keyframes pulse{50%{opacity:.35}}
.flow{stroke-dasharray:8 10;animation:flow 1.6s linear infinite}@keyframes flow{to{stroke-dashoffset:-36}}
</style>
<rect width="1200" height="310" fill="url(#bg)"/>
<rect width="1200" height="310" fill="url(#grid)"/>
<rect x="10" y="10" width="1180" height="290" rx="14" fill="#00CFFF" fill-opacity=".06" stroke="#00CFFF" stroke-opacity=".5"/>
<text x="60" y="38" font-size="13" letter-spacing="4" fill="#67E8F9">/// ION MATRIX · PROFILE NODE</text><text x="60" y="70" font-size="15" letter-spacing="3" fill="#00F0FF">ROLE</text><text x="250" y="70" font-size="18" fill="#E6FFFF">SWE · DevOps · Agentic AI Engineer</text><path d="M60 80H1140" stroke="#00CFFF" stroke-opacity=".18"/><text x="60" y="108" font-size="15" letter-spacing="3" fill="#00F0FF">LOCATION</text><text x="250" y="108" font-size="18" fill="#E6FFFF">India · open to remote</text><path d="M60 118H1140" stroke="#00CFFF" stroke-opacity=".18"/><text x="60" y="146" font-size="15" letter-spacing="3" fill="#00F0FF">EXPERIENCE</text><text x="250" y="146" font-size="18" fill="#E6FFFF">Full-Stack → Cloud / DevOps / Infra Automation</text><path d="M60 156H1140" stroke="#00CFFF" stroke-opacity=".18"/><text x="60" y="184" font-size="15" letter-spacing="3" fill="#00F0FF">FOCUS</text><text x="250" y="184" font-size="18" fill="#E6FFFF">Scalable systems · Platform Eng · GenAI workflows</text><path d="M60 194H1140" stroke="#00CFFF" stroke-opacity=".18"/><text x="60" y="222" font-size="15" letter-spacing="3" fill="#00F0FF">LEARNING</text><text x="250" y="222" font-size="18" fill="#E6FFFF">Multi-Cloud App Development</text><path d="M60 232H1140" stroke="#00CFFF" stroke-opacity=".18"/><text x="60" y="260" font-size="15" letter-spacing="3" fill="#00F0FF">PHILOSOPHY</text><text x="250" y="260" font-size="18" fill="#E6FFFF">Learn by building. Solve real problems. Ship to production.</text><path d="M60 270H1140" stroke="#00CFFF" stroke-opacity=".18"/>

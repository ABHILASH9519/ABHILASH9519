name: Install Mono Steel profile assets
on:
  push:
    paths:
      - ".mono-steel-assets-*.b64"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore Mono Steel design files
        run: |
          cat .mono-steel-assets-*.b64 | base64 --decode > /tmp/mono-steel.zip
          unzip -o /tmp/mono-steel.zip -d .
          rm -f .mono-steel-assets-*.b64 /tmp/mono-steel.zip
      - name: Commit complete profile design
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets scripts .github/workflows/contrib-calendar.yml
          git diff --cached --quiet || (git commit -m "feat(profile): install full Mono Steel design assets" && git push)

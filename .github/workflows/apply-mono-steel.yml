name: Apply Mono Steel SVG palette
on:
  push:
    paths:
      - "scripts/apply_mono_steel.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  recolor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Apply Mono Steel palette to profile SVGs
        run: python scripts/apply_mono_steel.py
      - name: Commit themed assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          git diff --staged --quiet || (git commit -m "style: apply mono steel SVG palette" && git push)
